name: Release

# A tag like v0.2.0 publishes the three packages. The tag has to match the
# version every package.json carries, so a bump that forgot a package or a tag
# that names the wrong number stops before anything reaches npm.
#
# Publishing uses npm trusted publishing: the job's OIDC token proves it is this
# workflow in this repository, and npm accepts that in place of a stored token.
# Each package page on npmjs.com names this file under Trusted Publisher.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  DO_NOT_TRACK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  publish:
    name: Pack, smoke, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: The tag names the version the packages carry
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for package in core themes cli; do
            version="$(node -p "require('./packages/$package/package.json').version")"
            if [ "$version" != "$tag" ]; then
              echo "packages/$package is $version, the tag says $tag"
              exit 1
            fi
          done

      - run: pnpm --filter @thebuilder/deckard-core exec playwright install --with-deps chromium

      # Builds from nothing, packs, inspects each tarball, and scaffolds a deck
      # from those exact files under pnpm and npm. What passes here is what ships.
      - run: pnpm release:pack

      # Core first: themes and the CLI name it as a peer, and init resolves the
      # caret range from the registry.
      - run: npm publish ./dist-tarballs/thebuilder-deckard-core.tgz --access public --provenance
      - run: npm publish ./dist-tarballs/thebuilder-deckard-themes.tgz --access public --provenance
      - run: npm publish ./dist-tarballs/thebuilder-deckard-cli.tgz --access public --provenance
